<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QCode · 登录</title><style nonce="NONCE">
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:#243b36;background:#f5f7f6;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,440px);padding:36px;background:#fff;border:1px solid #e4e9e7;border-radius:20px;box-shadow:0 16px 60px #203c370a}
img{width:48px;height:48px}
h1{font-size:26px;margin:20px 0 8px}
p{color:#71827c;margin:0 0 28px}
form,label{display:grid;gap:8px}
form{gap:22px}
label{font-size:14px;font-weight:500}
input,button{font:inherit;min-width:0}
input{width:100%;height:48px;padding:0 14px;border:1px solid #dce3e0;border-radius:10px;background:#fff;color:inherit;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#9aa7a2;font-weight:400}
input:hover,.password:hover{border-color:#a6b8af}
input:focus{outline:none;border-color:#27836a;box-shadow:0 0 0 3px #27836a18}
button{cursor:pointer;border:0;border-radius:10px;background:#176b54;color:#fff;height:48px;padding:0 16px;font-weight:500}
button:hover{background:#125c48}
button:disabled{opacity:.6;cursor:wait}
.password{display:grid;grid-template-columns:minmax(0,1fr) 46px;align-items:center;border:1px solid #dce3e0;border-radius:10px;transition:border-color .15s,box-shadow .15s}
.password:focus-within{border-color:#27836a;box-shadow:0 0 0 3px #27836a18}
.password input{border:0;background:transparent;height:46px;box-shadow:none}
.password button{display:grid;place-items:center;background:transparent;color:#72867d;height:38px;width:38px;padding:8px;border-radius:7px}
.password button:hover{background:#f0f5f2;color:#176b54}
.password svg{width:20px;height:20px}
.password .eye-slash{display:none}
.password button[aria-pressed=true] .eye-slash{display:block}
#status{font-size:13px;overflow-wrap:anywhere;margin:22px 0 0;min-height:21px}
#status[data-error=true]{color:#b4483a}
button:focus-visible{outline:2px solid #27836a;outline-offset:3px}
[hidden]{display:none!important}
@media(max-width:480px){body{padding:20px}main{padding:28px 24px}h1{font-size:24px}}
</style></head><body><main><img src="/icon.png" alt="QCode" width="48" height="48"><h1>登录 QCode</h1><p>使用团队账号，登录后进入编程工作台。</p><form id="login"><label>用户名<input name="username" autocomplete="username" maxlength="80" placeholder="请输入用户名" required autofocus></label><label>密码<span class="password"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="请输入密码" required><button type="button" id="eye" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button></span></label><button id="submit" type="submit">登录并打开工作台</button></form><p id="status" role="status" aria-live="polite">正在检查登录状态…</p></main><script nonce="NONCE">
const launchToken=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const form=document.getElementById('login'),status=document.getElementById('status'),submit=document.getElementById('submit'),password=document.getElementById('password');
let timer,redirecting=false;
async function request(route,body){const response=await fetch(route,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-QCode-Launch':launchToken},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(data.message||'访问链接已失效，请重新打开 QCode');return data;}
function show(data){status.textContent=data.message;status.dataset.error=String(data.state==='error'||!!data.notice);form.hidden=['starting','ready'].includes(data.state);submit.disabled=data.state==='starting';if(data.state==='ready'&&!redirecting){redirecting=true;setTimeout(()=>{location.assign(data.url);},data.notice?5000:0);}}
async function poll(){try{show(await request('/status'));timer=setTimeout(poll,1000);}catch(e){status.textContent='本地服务已关闭，请重新打开 QCode。';status.dataset.error='true';submit.disabled=true;}}
document.getElementById('eye').onclick=()=>{const visible=password.type==='password';password.type=visible?'text':'password';const eye=document.getElementById('eye');eye.setAttribute('aria-label',visible?'隐藏密码':'显示密码');eye.setAttribute('aria-pressed',String(visible));};
form.onsubmit=async event=>{event.preventDefault();clearTimeout(timer);submit.disabled=true;status.dataset.error='false';status.textContent='正在登录…';try{const username=form.elements.username.value;const secret=password.value;password.value='';show(await request('/login',{username,password:secret}));}catch(e){status.textContent=e.message;status.dataset.error='true';submit.disabled=false;}timer=setTimeout(poll,1000);};
poll();
</script></body></html>
